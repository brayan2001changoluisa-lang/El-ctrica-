/* ============ events ============ */
function initEvents(){
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-action]');
    if(!el)return;
    const a=el.dataset.action,id=el.dataset.id;
    if(el.closest('.contact')&&a!=='contact-pick'&&['contact-fav','contact-edit','contact-del'].includes(a))e.stopPropagation();
    switch(a){
      case'go':closePanel();go(el.dataset.to);SND.tick();break;
      case'go-transfer':go('transferencias');SND.tick();break;
      case'go-tarjetas':go('tarjetas');SND.tick();break;
      case'go-recibos':go('recibos');SND.tick();break;
      case'go-ahorro':go('ahorro');SND.tick();break;
      case'bizum':case'transfer':case'ingresar':case'tarjetas':case'recibos':case'ahorro':qaAction(a);SND.tick();break;
      case'tab-more':moreSheet();SND.tick();break;
      case'close-panel':closePanel();break;
      case'eye':S.settings.privacy=!S.settings.privacy;save();renderView();SND.tick();break;
      case'sound':S.settings.sound=!S.settings.sound;save();updateBadges();if(S.settings.sound)SND.pop();toast(S.settings.sound?'Sonidos activados':'Sonidos silenciados','','info');break;
      case'bell':notifDrawer();SND.tick();break;
      case'search-open':searchSheet();break;
      case'acc-details':accountSheet();break;
      case'copy':copyText(el.dataset.copy,el.dataset.label);break;
      case'qa-edit':qaEditSheet();break;
      case'qa-move':{const i=S.qaOrder.findIndex(q=>q.id===id);const j=i+ +el.dataset.dir;if(j<0||j>=S.qaOrder.length)break;const t=S.qaOrder[i];S.qaOrder[i]=S.qaOrder[j];S.qaOrder[j]=t;save();qaEditSheet();renderView();SND.tick();break}
      case'bizum-send':bizPickStep('send');SND.tick();break;
      case'bizum-request':bizPickStep('req');SND.tick();break;
      case'bizum-tab':bizTab=el.dataset.tab;renderView();SND.tick();break;
      case'contact-pick':{const c=S.contacts.find(x=>x.id===id);if(!c)break;flow.contact=c;flow.temp=false;bizAmountStep();SND.tick();break}
      case'contact-manual':{const p=$('#manual-phone').value.replace(/\s/g,'');const err=$('#manual-err');if(!validPhone(p)){err.innerHTML=I('alert')+' Móvil español no válido (6/7 + 8 dígitos)';SND.err();break}const ex=S.contacts.find(c=>c.phone===p);flow.contact=ex||{id:null,name:'+34 '+p,phone:p};flow.temp=!ex;bizAmountStep();break}
      case'contact-new':contactForm();break;
      case'contact-edit':contactForm(id);break;
      case'contact-save':contactSave();break;
      case'contact-del':contactDelete(id);break;
      case'contact-fav':{const c=S.contacts.find(x=>x.id===id);if(c){c.fav=!c.fav;save();renderView();SND.tick()}break}
      case'search-contact':{const c=S.contacts.find(x=>x.id===id);if(c){flow={type:'send'};flow.contact=c;flow.temp=false;bizAmountStep()}break}
      case'search-go':closePanel();go(el.dataset.to);break;
      case'flow-back':flowBack(el.dataset.step);break;
      case'flow-next':bizContinue();break;
      case'kp':kpPress(el.dataset.k);break;
      case'chip-amt':flow.amountStr=String(el.dataset.v);{const d=$('#kp-display');if(d){d.innerHTML=flow.amountStr+' <small>€</small>';d.classList.remove('zero')}}SND.tick();break;
      case'pin-d':pinPress(el.dataset.d);break;
      case'pin-del':if(flow.pinBuf){flow.pinBuf=flow.pinBuf.slice(0,-1);pinUpdate();SND.tick()}break;
      case'confirm-yes':{const fn=flow.onYes;closePanel();if(fn)fn();break}
      case'receipt-dl':if(lastReceipt)receiptPNG(lastReceipt);break;
      case'req-pay':{const r=S.requests.find(x=>x.id===id);if(!r)break;const c=S.contacts.find(x=>x.id===r.contactId);flow={type:'send',reqId:id,contact:c||{id:null,name:'Contacto',phone:''},temp:false,prefillAmount:r.amount,prefillConcept:r.concept};bizAmountStep();break}
      case'req-reject':{const idx=S.requests.findIndex(x=>x.id===id);if(idx<0)break;const r=S.requests[idx];S.requests.splice(idx,1);save();renderView();toast('Solicitud rechazada','','info',()=>{S.requests.splice(Math.min(idx,S.requests.length),0,r);save();renderView();toast('Solicitud restaurada','')});break}
      case'req-cancel':{const idx=S.requests.findIndex(x=>x.id===id);if(idx<0)break;const r=S.requests[idx];S.requests.splice(idx,1);save();renderView();toast('Solicitud cancelada','','info',()=>{S.requests.splice(Math.min(idx,S.requests.length),0,r);save();renderView();toast('Solicitud restaurada','')});break}
      case'req-remind':{const r=S.requests.find(x=>x.id===id);const c=r&&S.contacts.find(x=>x.id===r.contactId);toast('Recordatorio enviado',c?c.name+' recibirá un aviso':'','biz');SND.pop();break}
      case'tx':txDrawer(id);SND.tick();break;
      case'tx-note':{const t=S.tx.find(x=>x.id===id);if(t){t.note=$('#tx-note').value.trim();save();toast('Nota guardada','','info')}break}
      case'tx-receipt':{const t=S.tx.find(x=>x.id===id);if(t)receiptPNG(receiptFromTx(t));break}
      case'tx-repeat':{const t=S.tx.find(x=>x.id===id);if(!t)break;
        if(t.method==='bizum'){const c=S.contacts.find(x=>x.id===t.contactId)||{id:null,name:t.name,phone:''};flow={type:'send',contact:c,temp:!c.id,prefillAmount:Math.abs(t.amount),prefillConcept:t.concept};bizAmountStep()}
        else if(t.method==='transfer'){const b=S.beneficiaries.find(x=>x.iban===t.iban);prefillTransfer={beneId:b?b.id:null,amount:Math.abs(t.amount),concept:t.concept};closePanel();go('transferencias')}
        else{const r=S.recibos.find(x=>x.name===t.name);if(r){closePanel();reciboPay(r.id)}else toast('Recibo no disponible','','info')}
        break}
      case'cat-jump':mov={q:'',filter:'gastos',sort:'new',cat:el.dataset.cat,limit:40,viewId:''};go('movimientos');break;
      case'mov-chip':mov.filter=el.dataset.f;mov.limit=40;mov.viewId='';renderView();SND.tick();break;
      case'mov-cat-clear':mov.cat='';mov.viewId='';renderView();break;
      case'mov-clear':mov={q:'',filter:'todos',sort:'new',cat:'',limit:40,viewId:''};renderView();break;
      case'mov-more':mov.limit+=40;renderView();break;
      case'mov-export':exportCSV(filteredTx());break;
      case'mov-view':{const v=S.savedViews.find(x=>x.id===id);if(v){mov={q:v.q,filter:v.filter,sort:v.sort,cat:v.cat||'',limit:40,viewId:v.id};renderView();SND.tick()}break}
      case'mov-view-del':{e.stopPropagation();const idx=S.savedViews.findIndex(x=>x.id===id);if(idx<0)break;const v=S.savedViews[idx];S.savedViews.splice(idx,1);if(mov.viewId===id)mov.viewId='';save();renderView();toast('Vista eliminada',v.name,'info',()=>{S.savedViews.splice(Math.min(idx,S.savedViews.length),0,v);save();renderView();toast('Vista restaurada',v.name)});break}
      case'mov-view-save':saveViewSheet();break;
      case'mov-view-confirm':{const name=$('#sv-name').value.trim()||'Vista '+(S.savedViews.length+1);S.savedViews.push({id:uid(),name,q:mov.q,filter:mov.filter,sort:mov.sort,cat:mov.cat});save();closePanel();renderView();toast('Vista guardada',name,'gold');break}
      case'transfer-submit':transferSubmit();break;
      case'bene-new':beneForm();break;
      case'bene-save':beneSave();break;
      case'bene-del':beneDelete(id);break;
      case'sched-cancel':schedCancel(id);break;
      case'sched-now':schedNow(id);break;
      case'ingresar':ingresarSheet();SND.tick();break;
      case'ing-tab':{flow.tab=el.dataset.tab;$$('#panel-inner .pillbtn').forEach(b=>b.classList.toggle('on',b.dataset.tab===flow.tab));$('#ing-desc').textContent=flow.tab==='cash'?'Ingresa efectivo en cualquier cajero Áurea con tu tarjeta o código móvil.':'Ingreso desde una tarjeta de otro banco. Se abona al instante.';break}
      case'ing-chip':$('#ing-amount').value=fNum.format(+el.dataset.v);SND.tick();break;
      case'ing-submit':ingSubmit();break;
      case'card-select':selCard=id;revealCard=false;renderView();SND.tick();break;
      case'card-reveal':revealCard=!revealCard;renderView();SND.tick();break;
      case'card-copy':{const c=S.cards.find(k=>k.id===selCard);if(c)copyText(c.num,'Número de tarjeta copiado');break}
      case'card-movs':mov={q:'',filter:'card',sort:'new',cat:'',limit:40,viewId:''};go('movimientos');break;
      case'card-liquid':{const c=S.cards.find(k=>k.id===selCard);if(!c||c.used<=0)break;
        if(c.used>S.balance){toast('Saldo insuficiente','No puedes liquidar toda la deuda ahora','err');break}
        signConfirm({title:'Liquidar tarjeta de crédito',sub:'Pago total del dispuesto este mes',accent:'violet',amount:-c.used,
          rows:[['Tarjeta',c.name+' •••• '+c.num.slice(-4)],['Dispuesto',money(c.used,{force:true})],['Desde','Cuenta Áurea Premium']],
          onOk:()=>{const amt=c.used;S.balance=round2(S.balance-amt);c.used=0;const ref='LQ'+Date.now().toString().slice(-10);
            S.tx.unshift({id:uid(),ts:Date.now(),name:'Liquidación '+c.name,amount:-amt,cat:'compras',method:'card',concept:'Pago mensual crédito',ref,note:''});
            save();renderView();successSheet({title:'Tarjeta liquidada',amount:-amt,sign:false,accent:'#CBB8FF',lines:[['Tarjeta',c.name],['Crédito disponible',money(c.limit,{force:true})],['Referencia','<span class="mono">'+ref+'</span>']],receipt:{title:'Liquidación de crédito',amount:-amt,sign:false,lines:[['Tarjeta',c.name+' •••• '+c.num.slice(-4)],['Fecha',new Date().toLocaleString('es-ES')]],ref,ts:Date.now()}})}});
        break}
      case'hucha-new':huchaForm();break;
      case'hf-icon':{flow.hIcon=el.dataset.ic;flow.hHue=el.dataset.h;$$('#panel-inner [data-action="hf-icon"]').forEach(b=>b.classList.toggle('on',b.dataset.ic===flow.hIcon));SND.tick();break}
      case'hucha-save':huchaSave();break;
      case'hucha-add':huchaOp(id,'add');break;
      case'hucha-out':huchaOp(id,'out');break;
      case'ho-chip':$('#ho-amount').value=fNum.format(+el.dataset.v);SND.tick();break;
      case'ho-submit':huchaOpSubmit();break;
      case'hucha-del':huchaDelete(id);break;
      case'recibo-pay':reciboPay(id);break;
      case'recibo-new':reciboForm();break;
      case'recibo-save':reciboSave();break;
      case'recibo-del':reciboDelete(id);break;
      case'inv-op':invOp(id,el.dataset.op);break;
      case'inv-chip':$('#inv-amount').value=fNum.format(+el.dataset.v);SND.tick();break;
      case'inv-submit':invSubmit();break;
      case'loan-apply':loanApply();break;
      case'loan-cancel':{const lr=S.loanRequest;S.loanRequest=null;save();renderView();toast('Solicitud cancelada','','info',()=>{S.loanRequest=lr;save();renderView();toast('Solicitud restaurada','')});break}
      case'set-edit-profile':profileSheet();break;
      case'profile-save':{const name=$('#pf-name').value.trim(),email=$('#pf-email').value.trim(),phone=$('#pf-phone').value.replace(/\s/g,'');const err=$('#pf-err');
        if(name.length<2||!email.includes('@')||!validPhone(phone)){err.innerHTML=I('alert')+' Revisa los datos: nombre, email y móvil válido';SND.err();break}
        S.user={name,email,phone};save();closePanel();renderView();toast('Perfil actualizado',name);break}
      case'set-pin':pinChangeSheet();break;
      case'set-export':exportCSV(S.tx);break;
      case'set-reset':confirmSheet({title:'Restablecer aplicación',sub:'Se restaurarán los datos y ajustes iniciales',danger:true,okLabel:'Restablecer',
        rows:[['Se conservará','Nada · todo vuelve al estado inicial'],['Saldo inicial','67.000,00 €']],
        onYes:()=>{try{localStorage.removeItem(LS_KEY)}catch(_){}S=seed();save();lastShownBalance=null;mov={q:'',filter:'todos',sort:'new',cat:'',limit:40,viewId:''};bizTab='enviados';selCard='k0';closePanel();go('inicio');renderView();scheduleLive();toast('Aplicación restablecida','Datos iniciales restaurados','info')}});break;
      case'notif':{const n=S.notifications.find(x=>x.id===id);if(n){n.read=true;save();updateBadges();closePanel();if(n.route)go(n.route)}break}
      case'notif-read-all':S.notifications.forEach(n=>n.read=true);save();updateBadges();notifDrawer();SND.tick();break;
    }
  });
  document.addEventListener('input',e=>{
    const el=e.target.closest('[data-input]');if(!el)return;
    const k=el.dataset.input;
    if(k==='mov-q'){mov.q=el.value;mov.limit=40;mov.viewId='';const list=filteredTx();const box=$('#view .txlist');if(box)box.innerHTML=txGrouped(list,mov.limit)}
    else if(k==='contact-q'){contactQ=el.value;const g=$('#view .cgrid');const list=S.contacts.filter(c=>!contactQ||c.name.toLowerCase().includes(contactQ.toLowerCase())||c.phone.includes(contactQ));if(g)g.innerHTML=list.map(c=>contactCard(c)).join('');else renderView()}
    else if(k==='send-q'){sendQ=el.value;const l=$('#send-list');if(l)l.innerHTML=sendListHTML(sendQ)}
    else if(k==='search-q')searchResults(el.value.trim());
    else if(k==='iban-live'){const v=el.value.replace(/\s/g,'').toUpperCase();const hint=$('#iban-hint');if(hint){if(!v)hint.innerHTML='Introduce un IBAN español (24 caracteres)',hint.className='tiny dim';else if(ibanValid(v)){hint.innerHTML=I('check')+' IBAN válido';hint.className='ok-msg'}else{hint.innerHTML='IBAN incompleto o dígito de control incorrecto';hint.className='err-msg'}}}
    else if(k==='card-limit'){const c=S.cards.find(x=>x.id===el.dataset.id);if(c){c.limit=+el.value;fillRange(el);const lb=$('#card-limit-val');if(lb)lb.textContent=fMoney.format(c.limit);save()}}
    else if(k==='set-biz-limit'){S.settings.bizumDaily=+el.value;fillRange(el);const lb=$('#biz-limit-val');if(lb)lb.textContent=fMoney.format(S.settings.bizumDaily);save()}
    else if(k==='sim-a'||k==='sim-n'||k==='sim-t'){
      fillRange(el);
      if(k==='sim-a')sim.amount=+el.value;if(k==='sim-n')sim.months=+el.value;if(k==='sim-t')sim.tin=+el.value;
      $('#sim-a-val').textContent=fNum.format(sim.amount)+' €';$('#sim-n-val').textContent=sim.months+' años';$('#sim-t-val').textContent=fNum.format(sim.tin)+'%';
      const r=sim.tin/1200,n=sim.months*12,q=r>0?sim.amount*r/(1-Math.pow(1+r,-n)):sim.amount/n;
      $('#sim-quota').textContent=fNum.format(q)+' €';$('#sim-total').textContent=fNum.format(q*n)+' €';$('#sim-interest').textContent=fNum.format(q*n-sim.amount)+' €';
    }
  });
  document.addEventListener('change',e=>{
    const el=e.target.closest('[data-change]');if(!el)return;
    const k=el.dataset.change,id=el.dataset.id;
    if(k==='mov-sort'){mov.sort=el.value;mov.viewId='';renderView()}
    else if(k==='tx-cat'){const t=S.tx.find(x=>x.id===id);if(t){t.cat=el.value;save();renderView();txDrawer(id);toast('Categoría actualizada',CATS[el.value]?.l,'info')}}
    else if(k==='bene-select'){$('#tr-new').style.display=el.value==='new'?'block':'none'}
    else if(k==='sched-toggle'){$('#tr-sched-date').style.display=el.checked?'flex':'none'}
    else if(k==='set-toggle'){const key=el.dataset.k;S.settings[key]=el.checked;save();updateBadges();SND.tick();
      if(key==='sound'&&el.checked)SND.pop();
      if(key==='privacy'||key==='bio')renderView();
      toast(el.checked?'Activado':'Desactivado',{sound:'Sonidos',privacy:'Ocultar saldos',bio:'Firma biométrica',notifs:'Avisos de actividad'}[key],'info')}
    else if(k==='card-t'){const c=S.cards.find(x=>x.id===id);if(c){c[el.dataset.k]=el.checked;save();renderView();SND.tick();
      if(el.dataset.k==='frozen')toast(el.checked?'Tarjeta congelada ❄':'Tarjeta descongelada',c.name,el.checked?'info':'ok')}}
    else if(k==='recibo-toggle'){const r=S.recibos.find(x=>x.id===id);if(r){r.active=el.checked;save();renderView();SND.tick();toast(el.checked?'Domiciliación activada':'Domiciliación pausada',r.name,'info')}}
    else if(k==='qa-vis'){const q=S.qaOrder.find(x=>x.id===id);if(q){q.on=el.checked;save();renderView();SND.tick()}}
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&$('#panel').classList.contains('on'))closePanel();
    if(e.key==='Enter'&&e.target.id==='topbar-q'){mov.q=e.target.value;mov.limit=40;mov.viewId='';go('movimientos');e.target.value='';e.target.blur()}
    if(e.key==='Enter'&&e.target.id==='global-q'){const q=e.target.value.trim();if(q){mov.q=q;mov.limit=40;closePanel();go('movimientos')}}
    if(e.key==='Enter'&&e.target.id==='manual-phone'){const btn=document.querySelector('[data-action="contact-manual"]');if(btn)btn.click()}
    if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-action]')){e.preventDefault();e.target.click()}
  });
  window.addEventListener('hashchange',()=>{closePanel();$('#main').scrollTop=0;renderView()});
  /* tooltip */
  const tip=$('#tooltip');
  document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip]');if(el){tip.innerHTML=esc(el.dataset.tip);tip.classList.add('on')}});
  document.addEventListener('pointermove',e=>{if(tip.classList.contains('on')){const x=clamp(e.clientX+14,8,window.innerWidth-tip.offsetWidth-8),y=clamp(e.clientY+16,8,window.innerHeight-tip.offsetHeight-8);tip.style.left=x+'px';tip.style.top=y+'px'}});
  document.addEventListener('pointerout',e=>{if(e.target.closest&&e.target.closest('[data-tip]'))tip.classList.remove('on')});
  /* quick actions drag reorder */
  let dragEl=null;
  document.addEventListener('dragstart',e=>{const qa=e.target.closest('[data-qa-id]');if(!qa)return;dragEl=qa;qa.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',qa.dataset.qaId)}catch(_){}});
  document.addEventListener('dragover',e=>{const qa=e.target.closest('[data-qa-id]');if(!dragEl||!qa||qa===dragEl)return;e.preventDefault();const row=$('#qa-row');if(!row)return;const rect=qa.getBoundingClientRect();const before=(e.clientX-rect.left)<rect.width/2;row.insertBefore(dragEl,before?qa:qa.nextSibling)});
  document.addEventListener('dragend',()=>{if(!dragEl)return;dragEl.classList.remove('dragging');dragEl=null;const row=$('#qa-row');if(row){const order=[...row.querySelectorAll('[data-qa-id]')].map(n=>n.dataset.qaId);S.qaOrder.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));save();toast('Accesos reordenados','','info')}});
  /* responsive search button */
  const mq=window.matchMedia('(max-width:1023px)');
  const applyMQ=()=>{$('#tb-searchbtn').style.display=mq.matches?'grid':'none'};
  applyMQ();if(mq.addEventListener)mq.addEventListener('change',applyMQ);
}

/* ============ init ============ */
function init(){
  buildNav();initEvents();processDue();
  $('#tb-date').textContent=NOW().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  if(!location.hash)history.replaceState(null,'','#/inicio');
  renderView();
  scheduleLive();
  const hide=()=>{const sp=$('#splash');sp.classList.add('off');setTimeout(()=>sp.remove(),600)};
  if(document.readyState==='complete')setTimeout(hide,750);
  else window.addEventListener('load',()=>setTimeout(hide,650));
  setTimeout(hide,2600);
}
init();
</script>
</body>
</html>
