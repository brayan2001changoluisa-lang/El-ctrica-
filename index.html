function events(){
document.addEventListener('click',function(ev){
var el=near(ev.target,'[data-a]');if(!el)return;
var f=A[el.getAttribute('data-a')];
if(f){ev.preventDefault();try{f(el)}catch(z){toast('No se pudo completar','','err')}}
});
document.addEventListener('input',function(ev){var el=near(ev.target,'[data-n]');if(!el)return;var f=N[el.getAttribute('data-n')];if(f)try{f(el)}catch(z){}});
document.addEventListener('change',function(ev){var el=near(ev.target,'[data-c]');if(!el)return;var f=C[el.getAttribute('data-c')];if(f)try{f(el)}catch(z){}});
document.addEventListener('keydown',function(ev){
if(ev.key==='Escape'&&q('#sheet').className.indexOf('on')>=0)close();
if(ev.key==='Enter'&&ev.target.id==='gq'){var v=ev.target.value.trim();if(v){MV.q=v;MV.lim=30;close();go('activity')}}
if(ev.key==='Enter'&&ev.target.id==='mph'){var b=document.querySelector('[data-a="cman"]');if(b)b.click()}
if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('[role="button"][data-a]')){ev.preventDefault();ev.target.click()}
});
window.addEventListener('hashchange',function(){close();q('#main').scrollTop=0;render(true)});
var dg=null;
document.addEventListener('dragstart',function(ev){var el=near(ev.target,'[data-q]');if(!el)return;dg=el;el.className='drag';if(ev.dataTransfer){ev.dataTransfer.effectAllowed='move';try{ev.dataTransfer.setData('text/plain',el.getAttribute('data-q'))}catch(z){}}});
document.addEventListener('dragover',function(ev){var el=near(ev.target,'[data-q]');if(!dg||!el||el===dg)return;ev.preventDefault();var row=q('#qar');if(!row)return;var r=el.getBoundingClientRect();row.insertBefore(dg,(ev.clientX-r.left)<r.width/2?el:el.nextSibling)});
document.addEventListener('dragend',function(){
if(!dg)return;dg.className='';dg=null;var row=q('#qar');if(!row)return;
var o=[],n=row.querySelectorAll('[data-q]'),i;for(i=0;i<n.length;i++)o.push(n[i].getAttribute('data-q'));
S.qa.sort(function(a,b){var x=o.indexOf(a.id),y=o.indexOf(b.id);return (x<0?99:x)-(y<0?99:y)});save();render();toast('Accesos reordenados','','info');
});
}
function init(){
load();buildTabs();buildSide();events();due();
if(!location.hash){try{history.replaceState(null,'','#/home')}catch(z){}}
LASTB=S.bal;
render(true);liveTick();tick();
window.__ok=true;
var sp=q('#splash');if(sp){sp.style.opacity='0';sp.style.visibility='hidden';setTimeout(function(){if(sp.parentNode)sp.parentNode.removeChild(sp)},500)}
q('#fallback').style.display='none';
}
try{init()}catch(z){
window.__ok=true;
var sp2=q('#splash');if(sp2){sp2.style.opacity='0';sp2.style.visibility='hidden'}
var fb=q('#fallback');if(fb)fb.style.display='grid';
}
})();
</script>
