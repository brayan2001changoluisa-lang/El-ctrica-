function tsend(){

 if(sel==="new"){

  bn={name:n,iban:ib};
 }else{bn=find(S.ben,sel);if(!bn)return bad("Selecciona un beneficiario")}
 var v=amt(q("#tam").value);
 if(isNaN(v)||v<=0)return bad("Introduce un importe válido");

 var co=q("#tco").value.trim()||"Transferencia";
 var te=document.querySelector('input[name="tty"]:checked'),ty=te?te.value:"std";
 var dt=null;
 if(q("#tsc").checked){dt=q("#tdt2").value;if(!dt||dt<=iso())return bad("Elige una fecha futura para programar")}
 var sv=sel==="new"&&q("#tsv").checked;

  rows:[["Beneficiario",e(bn.name)],["IBAN",'<span class="mo">'+ifmt(bn.iban).slice(0,14)+'…</span>'],["Concepto",e(co)],["Tipo",ty==="inst"?"Inmediata":"Estándar SEPA"],["Comisión",'<span style="color:#5DE9AF">Gratis</span>'],["Ejecución",dt?fd(new Date(dt+"T09:00:00").getTime(),1):(ty==="inst"?"Ahora mismo":"Próximo día hábil")]],
  next:function(){
   if(sv&&!S.ben.filter(function(b){return b.iban===bn.iban}).length)S.ben.push({id:id(),name:bn.name,iban:bn.iban,tag:"Guardado"});
   if(dt){S.sch.push({id:id(),name:bn.name,iban:bn.iban,val:v,con:co,type:ty,date:dt});save();close();render();SND.ok();toast("Transferencia programada",FN.format(v)+" € a "+bn.name,"info");note("cal","#5A96FF","Transferencia programada",FN.format(v)+" € a "+bn.name+" el "+fd(new Date(dt+"T09:00:00").getTime()),"transferencias");return}

   S.tx.unshift({id:id(),ts:Date.now(),name:bn.name,val:-v,cat:"trf",met:"transfer",con:co,ref:ref,note:"",iban:bn.iban});
   save();render();note("swap","#5A96FF","Transferencia enviada",FN.format(v)+" € a "+bn.name,"movimientos");
   ok({t:ty==="inst"?"Transferencia enviada al instante":"Transferencia enviada",val:-v,col:"#FFD98A",rows:[["Beneficiario",e(bn.name)],["Concepto",e(co)],["Fecha",new Date().toLocaleString("es-ES")],["Referencia",'<span class="mo">'+ref+'</span>']],
    rc:{t:"Transferencia SEPA",val:-v,rows:[["Beneficiario",bn.name],["IBAN",ifmt(bn.iban)],["Concepto",co],["Fecha",new Date().toLocaleString("es-ES")]],ref:ref,ts:Date.now()}});
  }});
}

function due(){
